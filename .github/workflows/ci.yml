name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        extras: [core, all]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: pip install uv
      - name: Install core without optional capabilities
        if: matrix.extras == 'core'
        run: |
          uv sync --locked
          uv pip install pytest PyYAML
      - name: Install every optional capability from the lockfile
        if: matrix.extras == 'all'
        run: uv sync --locked --all-extras
      - name: Guard the zero-dependency invariant
        run: |
          uv run --no-sync python - <<'EOF'
          import importlib.metadata as md
          deps = md.requires("neterse") or []
          runtime = [d for d in deps if "extra ==" not in d]
          assert not runtime, f"runtime deps crept in: {runtime}"
          print("zero runtime dependencies: OK")
          EOF
      - name: Spec drift gate (YAML sources ↔ generated _compiled.py)
        run: uv run --no-sync python scripts/compile_specs.py --check
      - name: Golden drift gate (fixture renderings ↔ committed expected.txt)
        run: uv run --no-sync python scripts/update_goldens.py --check
      - name: Tests (behavioral + byte-parity vs frozen baseline)
        run: uv run --no-sync pytest
      - name: Coverage table (the numbers CONTRIBUTING asks PRs to paste)
        run: uv run --no-sync python -m neterse audit tests/fixtures --fail-under 20

  # Every PR commit certifies the Developer Certificate of Origin
  # (decision 41): captures from real networks need a provenance trail.
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Signed-off-by on every commit (git commit -s)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF"
          missing=0
          for sha in $(git rev-list "origin/$BASE_REF..HEAD" --no-merges); do
            if ! git log -1 --format=%B "$sha" | grep -qiE '^Signed-off-by: .+<.+>'; then
              echo "::error::commit $sha lacks a Signed-off-by trailer — amend with 'git commit -s' (see CONTRIBUTING 'Sign your commits')"
              missing=1
            fi
          done
          exit $missing

  # Convenience for contributors without a working local setup: regenerate
  # every committed artifact and, when the PR forgot one, upload the diff
  # as a patch to download-and-commit. Never fails — the drift gates in
  # the test job are the enforcement.
  regenerated-artifacts:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install (with the pinned tokenizer)
        run: pip install -e ".[test]" tiktoken==0.13.0
      - name: Regenerate committed artifacts
        run: |
          python scripts/compile_specs.py
          python scripts/update_goldens.py
          python scripts/update_token_baseline.py
      - name: Collect the diff (empty when the PR committed everything)
        id: diffcheck
        run: |
          git add -N .
          # --binary so a control-byte-bearing golden (raw captures are
          # byte-exact) can't reduce the patch to an unappliable stub.
          git diff --binary > regenerated.patch
          if [ -s regenerated.patch ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Some committed artifacts need regeneration —" \
                 "download the 'regenerated-artifacts' patch, apply with" \
                 "'git apply regenerated.patch', and commit."
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: steps.diffcheck.outputs.changed == 'true'
        with:
          name: regenerated-artifacts
          path: regenerated.patch

  token-savings:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install with the PINNED tokenizer (CI-only; never a runtime dep)
        run: pip install -e ".[test]" tiktoken==0.13.0
      - name: Token-savings regression vs committed baseline (o200k_base)
        run: pytest tests/test_token_savings.py -v

  dependencies:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Audit the locked optional dependency graph
        run: |
          pip install uv pip-audit
          uv export --locked --all-extras --no-emit-project --output-file audit-requirements.txt
          pip-audit --no-deps --disable-pip -r audit-requirements.txt
