name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (zero-dep core + pytest)
        run: pip install -e ".[test]"
      - name: Guard the zero-dependency invariant
        run: |
          python - <<'EOF'
          import importlib.metadata as md
          deps = md.requires("neterse") or []
          runtime = [d for d in deps if "extra ==" not in d]
          assert not runtime, f"runtime deps crept in: {runtime}"
          print("zero runtime dependencies: OK")
          EOF
      - name: Spec drift gate (YAML sources ↔ generated _compiled.py)
        run: python scripts/compile_specs.py --check
      - name: Golden drift gate (fixture renderings ↔ committed expected.txt)
        run: python scripts/update_goldens.py --check
      - name: Tests (behavioral + byte-parity vs frozen baseline)
        run: pytest
      - name: Coverage table (the numbers CONTRIBUTING asks PRs to paste)
        run: python -m neterse audit tests/fixtures --fail-under 20

  # Convenience for contributors without a working local setup: regenerate
  # every committed artifact and, when the PR forgot one, upload the diff
  # as a patch to download-and-commit. Never fails — the drift gates in
  # the test job are the enforcement.
  regenerated-artifacts:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (with the pinned tokenizer)
        run: pip install -e ".[test]" tiktoken==0.13.0
      - name: Regenerate committed artifacts
        run: |
          python scripts/compile_specs.py
          python scripts/update_goldens.py
          python scripts/update_token_baseline.py
      - name: Collect the diff (empty when the PR committed everything)
        id: diffcheck
        run: |
          git add -N .
          git diff > regenerated.patch
          if [ -s regenerated.patch ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Some committed artifacts need regeneration —" \
                 "download the 'regenerated-artifacts' patch, apply with" \
                 "'git apply regenerated.patch', and commit."
          fi
      - uses: actions/upload-artifact@v4
        if: steps.diffcheck.outputs.changed == 'true'
        with:
          name: regenerated-artifacts
          path: regenerated.patch

  token-savings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with the PINNED tokenizer (CI-only; never a runtime dep)
        run: pip install -e ".[test]" tiktoken==0.13.0
      - name: Token-savings regression vs committed baseline (o200k_base)
        run: pytest tests/test_token_savings.py -v
