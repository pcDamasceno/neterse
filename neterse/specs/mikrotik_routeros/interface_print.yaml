# /interface print (MikroTik RouterOS) -> CSV.
command: '^/interface\s+print'
platforms: 'mikrotik|routeros'
strategy: line_regex_table
#      1: item number   2: flags (R running, D dynamic, X disabled)
#      3: name   4: type   5: actual-mtu   6: l2mtu
row: '^(\d+)\s+(?:([A-Z]{1,3})\s+)?(\S+)\s+(\S+)\s+(\d+)(?:\s+(\d+))?$'
header: num,flags,name,type,mtu,l2mtu
dropped_fields: []
