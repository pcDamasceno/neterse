# /ip address print (MikroTik RouterOS) -> CSV; the Flags legend line is
# dropped.
command: '^/ip\s+address\s+print'
platforms: 'mikrotik|routeros'
strategy: line_regex_table
#      1: item number   2: flags (D, X, I, ...)   3: address   4: network
#      5: interface
row: '^(\d+)\s+(?:([A-Z]{1,3})\s+)?(\d+\.\d+\.\d+\.\d+/\d+)\s+(\d+\.\d+\.\d+\.\d+)\s+(\S+)$'
header: num,flags,address,network,interface
dropped_fields: []
doc: >-
  /ip address print (MikroTik RouterOS) -> CSV; the Flags legend line is
  dropped.
