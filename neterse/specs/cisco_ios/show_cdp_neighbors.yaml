# show cdp neighbors (IOS/IOS-XE fixed-width) -> CSV.
#
# IOS/IOS-XE `show cdp neighbors` is a fixed-width table whose values
# carry spaces (`Eth 0/0`, `Linux Uni`) — the legacy line-regex entry
# (cisco/show_cdp_lldp_neighbors, NX-OS-shaped single-token rows) fails
# open on it, which is exactly how the bgp_fundamentals lab surfaced
# this gap (decision 25). Keyed on the IOS header spelling `Holdtme`
# (NX-OS prints `Hldtme`), so the two entries never compete on the same
# body. Long device IDs wrap onto their own line; `first_col_wraps`
# re-joins them.
command: 'show\s+cdp\s+neigh(?:bors?)?\s*$'
platforms: 'ios|xe'
strategy: fixed_width_table
keywords: ['Device ID', 'Local Intrfce', Holdtme, Capability, Platform, 'Port ID']
row_match: '^\S+$'
first_col_wraps: true
header: device,local_intf,holdtime,capability,platform,remote_port
dropped_fields: [entry_count]
doc: >-
  show cdp neighbors (IOS fixed-width) -> CSV; capability legend and the
  derivable 'Total cdp entries' line are dropped, holdtime is kept (the
  legacy entry drops it).
