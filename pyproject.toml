[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# `neterse` = "network terse": the natural name `terse` is squatted on PyPI
# by an abandoned 2019 package. Distribution, import, and CLI
# share the one name.
name = "neterse"
version = "0.5.0"                     # keep in lockstep with neterse.__version__
description = "neterse — minimum-token renderings of network CLI output for LLM agents. The `| brief` the vendor never shipped."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Pedro Damasceno" }]
keywords = [
    "network-automation", "llm", "tokens", "cli", "toon",
    "cisco", "nxos", "ios", "agents", "prompt-engineering",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking",
]
# Invariant: the runtime dependency list stays EMPTY. Parsers and
# tokenizers are extras; the core imports the standard library only.
dependencies = []

[project.urls]
Homepage = "https://github.com/pcDamasceno/neterse"
Issues = "https://github.com/pcDamasceno/neterse/issues"

[project.scripts]
neterse = "neterse.audit:main"
neterse-mcp = "neterse.mcp:main"

[project.optional-dependencies]
# --- capability extras: each one widens what neterse can do -------------
# Drives ntc-templates/TextFSM from neterse.ntc: parse + render in one
# call. The core never imports it — everything fails open without it.
textfsm = ["ntc-templates"]
# The spec authors' own encoders. Installed, they PRODUCE parsed:gcf /
# parsed:toon instead of our stdlib readings of the specs — same bytes
# where both apply, plus the document forms a flat row table cannot
# express (named tables, API envelopes, ragged rows, array cells).
# Absent, the stdlib encoders stand in; nothing here is ever required.
gcf = ["gcf-python>=2.4"]
# toon-format's 0.1.0 "stable" ships an encoder that raises
# NotImplementedError, so the floor is the pre-release that works — and
# 0.9.0b1 > 0.1.0 under PEP 440, so this pins to it exactly. Naming the
# pre-release in the specifier is what lets pip resolve one here without
# a global --pre.
toon = ["toon-format>=0.9.0b1"]
# Real token counts for scripts/neterse_report.py and the CI savings
# gate. Deliberately NOT a runtime concern: Candidate.est_tokens() is
# chars/4 (decision 8) and the package never imports a tokenizer, so
# this changes what the tooling can measure, not what the library does.
tokens = ["tiktoken"]
# MCP tool results — phase 8's first non-CLI surface (decision 38).
# fastmcp powers the two adapters only: the `neterse-mcp` stdio proxy
# that compacts ANY server's results from the client's config seam, and
# CompactMiddleware for FastMCP servers you author. The pure seam
# (compact_text / compact_result) is stdlib and works without this.
# fastmcp needs 3.10+; the marker keeps `neterse[all]` resolving on 3.9,
# where this extra installs nothing and the adapters fail open like any
# other missing extra.
mcp = ["fastmcp>=3; python_version >= '3.10'"]
#
# --- aggregates --------------------------------------------------------
# Everything above, for people who would rather not track which capability
# lives in which extra. Still installs nothing the library imports: the
# runtime dependency list stays empty and every extra fails open.
# `test` is out on purpose — pytest and PyYAML are for working ON neterse,
# not with it. tests/test_packaging.py gates this list against the extras
# above so a new capability cannot quietly go missing from it.
all = ["neterse[gcf,mcp,textfsm,toon,tokens]"]
full = ["neterse[all]"]              # alias; both spellings get guessed
#
# --- development -------------------------------------------------------
# PyYAML is authoring-time tooling only (scripts/compile_specs.py and the
# spec drift test) — the runtime imports the generated _compiled.py. The
# encoder extras come in by reference so the version floors above are the
# only ones: CI must test the versions users actually resolve.
test = ["neterse[gcf,toon]", "pytest", "PyYAML"]

[tool.setuptools]
# EVERY subpackage must be listed — an omission builds a wheel that
# imports fine from a source checkout and fails on `pip install`.
# tests/test_packaging.py enforces this against the tree.
packages = ["neterse", "neterse.normalizers", "neterse.specs"]

[tool.setuptools.package-data]
neterse = ["py.typed"]
# The YAML sources ship as reference data (the compiled module is what
# the runtime imports); <vendor>/ dirs are data dirs, not packages.
"neterse.specs" = ["*/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
