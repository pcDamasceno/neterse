[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# Distribution name is `terse-net` because `terse` on PyPI is squatted by an
# abandoned 2019 package (PEP 541 name-transfer is a later option). The
# IMPORT name is plain `terse`.
name = "terse-net"
version = "0.3.0"                     # keep in lockstep with terse.__version__
description = "terse — minimum-token renderings of network CLI output for LLM agents. The `| brief` the vendor never shipped."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Pedro Damasceno" }]
keywords = [
    "network-automation", "llm", "tokens", "cli", "toon",
    "cisco", "nxos", "ios", "agents", "prompt-engineering",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking",
]
# Invariant: the runtime dependency list stays EMPTY. Parsers and
# tokenizers are extras; the core imports the standard library only.
dependencies = []

[project.urls]
Homepage = "https://github.com/pcDamasceno/terse"
Issues = "https://github.com/pcDamasceno/terse/issues"

[project.optional-dependencies]
test = ["pytest"]
# Later phases: textfsm = ["ntc-templates"], tokens = ["tiktoken"], …

[tool.setuptools]
packages = ["terse"]

[tool.setuptools.package-data]
terse = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
